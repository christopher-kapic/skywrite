[package]
name = "skywrite"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Agent-friendly media understanding, synchronization, and editing CLI"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
libc = "0.2"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.23"
url = "2.5"

[profile.release]
lto = "thin"
strip = true
