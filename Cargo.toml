[package]
name = "skywrite"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Agent-friendly media understanding, synchronization, and editing CLI"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
libc = "0.2"
# Safe signal notification; one owner supervises all concurrent child process groups.
signal-hook = "0.4"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.23"
url = "2.5"
# Already used by Takumi; inspect local image dimensions before decoding.
imagesize = "0.15"
# Original upstream stable renderer; HTML parsing and raster codecs are native.
takumi = { version = "=2.19.0", default-features = false, features = ["from-html", "raster-backend", "png", "jpeg", "webp", "woff2"] }

[profile.release]
lto = "thin"
strip = true
